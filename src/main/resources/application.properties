spring.application.name=intelbras-event-engine
server.port=3000

app.kafka.topics.device-events.name=device-events
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties[spring.deserializer.value.delegate.class]=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.value.default.type]=io.github.LeoRam0s.intelbras_event_engine.device_event.dto.DeviceEventDto
spring.kafka.consumer.properties[spring.json.trusted.packages]=io.github.LeoRam0s.intelbras_event_engine.device_event.dto

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:intelbrasdb}}
spring.datasource.username=${POSTGRES_USER:intelbras}
spring.datasource.password=${POSTGRES_PASSWORD:intelbras}

management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.distribution.percentiles-histogram.device.events.processing=true
management.metrics.distribution.minimum-expected-value.device.events.processing=1ms
management.metrics.distribution.maximum-expected-value.device.events.processing=5s

logging.file.name=logs/intelbras-event-engine.json
logging.structured.format.file=logstash
